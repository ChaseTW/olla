<!doctype html>

    .not-found p{font-size:18px;max-width:30em;margin:0 0 35px}
    .not-found-links{display:flex;flex-wrap:wrap;gap:22px}
    @media(max-width:720px){.not-found-inner{grid-template-columns:1fr}.not-found-code{font-size:110px}}
